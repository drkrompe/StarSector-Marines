<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100">
  <!-- A tier as rank chevrons, one a tier: pale insignia bars with a dark edge, a lit top and a
       shadow under each, so they stand off the tier's tone rather than printing on it. -->
    <polygon points="40,42.5 75,20.5 110,42.5 110,53.5 75,31.5 40,53.5" fill="#000000" fill-opacity="0.45"/>
    <polygon points="40,38.5 75,16.5 110,38.5 110,49.5 75,27.5 40,49.5" fill="#fff4d6" stroke="#1c140a" stroke-width="4" stroke-linejoin="miter"/>
    <polyline points="43,39 75,19 107,39" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
    <polygon points="40,59.5 75,37.5 110,59.5 110,70.5 75,48.5 40,70.5" fill="#000000" fill-opacity="0.45"/>
    <polygon points="40,55.5 75,33.5 110,55.5 110,66.5 75,44.5 40,66.5" fill="#fff4d6" stroke="#1c140a" stroke-width="4" stroke-linejoin="miter"/>
    <polyline points="43,56 75,36 107,56" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
    <polygon points="40,76.5 75,54.5 110,76.5 110,87.5 75,65.5 40,87.5" fill="#000000" fill-opacity="0.45"/>
    <polygon points="40,72.5 75,50.5 110,72.5 110,83.5 75,61.5 40,83.5" fill="#fff4d6" stroke="#1c140a" stroke-width="4" stroke-linejoin="miter"/>
    <polyline points="43,73 75,53 107,73" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
</svg>
