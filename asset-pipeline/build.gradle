plugins {
    id 'java-library'
}

group = 'com.dillon.starsectormarines'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

// Two source sets:
//   main  — runtime, ships in the mod jar. No LWJGL 3, no Assimp. JOML + plain Java only.
//   tool  — build-time importer. Runs OUTSIDE Starsector; can use Assimp + LWJGL 3 + Log4j 2 freely.
sourceSets {
    tool {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    toolImplementation.extendsFrom implementation
    toolCompileOnly.extendsFrom compileOnly
    toolAnnotationProcessor.extendsFrom annotationProcessor
    toolRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // ---- main (runtime) ----
    api "org.joml:joml:${jomlVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // ---- tool (build-time importer) ----
    toolImplementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    toolImplementation "org.lwjgl:lwjgl-assimp"
    toolImplementation "org.lwjgl:lwjgl-stb"
    toolImplementation "org.apache.logging.log4j:log4j-api:${log4j2Version}"
    toolImplementation "org.apache.logging.log4j:log4j-core:${log4j2Version}"
    toolImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    toolCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    toolAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    toolRuntimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
    toolRuntimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-windows"
    toolRuntimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-windows"
    toolRuntimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-linux"
    toolRuntimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-linux"
    toolRuntimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos"
    toolRuntimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-macos"

    // ---- tests ----
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Build-time task: convert FBX/BVH source models to .mlmodel binaries.
def javaToolchains = project.extensions.getByType(JavaToolchainService)

tasks.register('processModels', JavaExec) {
    description 'Convert FBX/BVH model files into pre-processed .mlmodel binary format'
    group 'build'

    classpath = sourceSets.tool.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.assets.pipeline.ProcessModelsTask'

    def inputDir  = file('src/tool/resources')
    def outputDir = file("${layout.buildDirectory.get()}/processed-models")

    inputs.dir inputDir
    outputs.dir outputDir
    args inputDir.absolutePath, outputDir.absolutePath

    jvmArgs '--enable-native-access=ALL-UNNAMED'
    javaLauncher = javaToolchains.launcherFor(project.java.toolchain)
}

// Transcode WAV/OGG source clips listed in src/tool/resources/audio/audio.json into Ogg Vorbis
// files written directly into the shipped mod folder (mod/sounds/). Requires ffmpeg on PATH.
tasks.register('processAudio', JavaExec) {
    description 'Transcode WAV/OGG source clips into Ogg Vorbis under mod/sounds/ (requires ffmpeg)'
    group 'build'

    classpath = sourceSets.tool.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.assets.pipeline.ProcessAudioTask'

    def inputDir  = file('src/tool/resources/audio')
    def outputDir = file("${rootDir}/mod/sounds")

    inputs.dir inputDir
    outputs.dir outputDir
    args inputDir.absolutePath, outputDir.absolutePath

    javaLauncher = javaToolchains.launcherFor(project.java.toolchain)
}

// Derives <sheet>_height.png / <sheet>_normal.png for terrain tile-sheet albedos
// listed in src/tool/resources/tilemaps/tilemaps.json, written next to each source
// sheet under mod/graphics/. See TileMapRecipeManifest for the manifest schema.
tasks.register('deriveTileMaps', JavaExec) {
    description 'Derive height/normal maps for terrain tile sheets from their albedo PNGs'
    group 'build'

    classpath = sourceSets.tool.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.assets.pipeline.DeriveTileMapsTask'

    def tilesetDir   = file("${rootDir}/mod/data/tilesets")  // *.tileset.json (sheet + grid/slice metadata)
    def modDir       = file("${rootDir}/mod")                // "sheet" paths in tileset json are relative to this
    def graphicsDir  = file("${rootDir}/mod/graphics")       // albedo PNGs live here; baked outputs land here too
    def recipeFile   = file('src/tool/resources/tilemaps/tilemaps.json')

    inputs.dir tilesetDir
    inputs.file recipeFile
    // NOT inputs.dir(graphicsDir) -- that would treat this task's own prior
    // outputs (*_height.png / *_normal.png, checked in next to the albedos)
    // as new input on the following run.
    inputs.files fileTree(graphicsDir) {
        include '**/*.png'
        exclude '**/*_height.png', '**/*_normal.png'
    }
    outputs.dir graphicsDir
    args tilesetDir.absolutePath, modDir.absolutePath, recipeFile.absolutePath

    javaLauncher = javaToolchains.launcherFor(project.java.toolchain)
}
