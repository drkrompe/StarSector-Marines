// Fights loadouts against each other, headless, on the starter scenarios (open field, trench, building) at
// several seeds, and reports who wins and at what cost. Opt-in and excluded from `test`: it plays whole battles,
// which is evidence. Serial scheduler for the reason sceneEvidence uses it; the fights themselves run side by side.
tasks.register('loadoutMatchup', Test) {
    group = 'verification'
    description = 'Fight loadout cards against each other headlessly; opt-in, excluded from test.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'loadout-matchup'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.influence.async', 'false'
    systemProperty 'battle.pathfinding.asyncClearance', 'false'
    systemProperty 'battle.unitUpdate.minimumParallelUnits', Integer.MAX_VALUE.toString()
    forwardBattleSwitches(delegate)
    systemProperty 'loadoutMatchup.dir', layout.buildDirectory.dir('reports/loadout-matchups').get().asFile.absolutePath
    // `-PsnapshotBackend=gl` records the GIFs through the shipping renderer on the GPU (`ReviewSceneBackend`),
    // which draws what Java2D does not: relief, sun shadows, event lights and per-quad effects such as hit flash.
    if (providers.gradleProperty('snapshotBackend').isPresent()) {
        systemProperty 'snapshot.backend', providers.gradleProperty('snapshotBackend').get()
    }
    ['scenarios', 'seeds', 'parallelism', 'attacker', 'defender', 'gifs', 'gifSeeds', 'fireMission'].each { name ->
        if (providers.gradleProperty(name).isPresent()) {
            systemProperty "loadoutMatchup.${name}", providers.gradleProperty(name).get()
        }
    }
    testLogging {
        showStandardStreams = true
    }
}

