plugins {
    id 'java'
    // Bundles runtime deps and rewrites their packages so they can't collide
    // with other mods' copies. fastutil in particular: the game's classloader
    // is shared, so an unrelocated copy would fight other mods that ship
    // their own version.
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.dillon.starsectormarines'
version = '0.0.1'

def starsectorDir = file(providers.gradleProperty('starsectorDir').get())
def starsectorCore = new File(starsectorDir, 'starsector-core')
def starsectorModsDir = new File(starsectorDir, 'mods')

def modName = 'StarsectorMarines'
def modId   = 'starsector_marines' // must match StarsectorMarinesModPlugin.MOD_ID
def modOutputDir = file("$projectDir/mod")
def modJarsDir = new File(modOutputDir, 'jars')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    flatDir {
        dirs starsectorCore
    }
}

configurations {
    starsector
}

dependencies {
    // Starsector runtime — provided by the game, never bundled into our jar.
    compileOnly files(
            new File(starsectorCore, 'starfarer.api.jar'),
            new File(starsectorCore, 'starfarer_obf.jar'),
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
            new File(starsectorCore, 'json.jar'),
            new File(starsectorCore, 'log4j-1.2.9.jar'),
            new File(starsectorCore, 'xstream-1.4.10.jar'),
            new File(starsectorCore, 'fs.common_obf.jar'),
    )

    // Asset-pipeline runtime classes (mesh data, model serializer, scene/skeleton/animation PODs).
    // Bundled into the mod jar via the fat-jar config below.
    implementation project(':asset-pipeline')

    // fastutil-core: primitive-keyed maps/sets for hot AI/sim paths (squad lookup,
    // crowding tables, zone ids). Shaded into our own namespace via shadowJar's
    // relocate rule below so it can't collide with another mod's copy on the
    // shared classloader.
    implementation "it.unimi.dsi:fastutil-core:${fastutilVersion}"

    // Lombok — same convention as the asset-pipeline module so shared style works.
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(':layer-authoring')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation files(
            new File(starsectorCore, 'starfarer.api.jar'),
            new File(starsectorCore, 'json.jar'),
            new File(starsectorCore, 'log4j-1.2.9.jar'),
    )
    // Campaign API interfaces expose LWJGL vector types in method signatures.
    // Keep them available to reflection-based API fakes without bundling them.
    testRuntimeOnly files(
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
    )
}

test {
    useJUnitPlatform {
        excludeTags 'battle-profile', 'commander-balance',
                'sabotage-command-evidence', 'assault-command-evidence',
                'raid-command-evidence', 'extraction-objective-evidence'
    }
    testLogging {
        // Audit-style tests print their report to stdout — stream it to the
        // gradle console so devs don't have to dig through the XML report.
        showStandardStreams = true
    }
    // EngineSlotPreviewTest loads vanilla .ship files + sprites from the
    // game install; forward the project-level `starsectorDir` gradle property
    // so the test can find them. Same source of truth the build.gradle root
    // uses for compileOnly + deployMod (resolved at line 13).
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    // Opt-in gate for the ecs-migration Phase-0 access micro-bench
    // (EcsAccessBenchTest). Off by default so the normal suite stays fast for
    // concurrent sessions; run on demand with `-Decs.bench=true`.
    systemProperty 'ecs.bench', System.getProperty('ecs.bench', 'false')
}

def commanderEvidenceMission = providers.gradleProperty('mission')
        .orElse(providers.systemProperty('commander.evidence.mission'))
        .getOrElse('').trim().toLowerCase()
def commanderEvidenceTags = [
        conquest: 'commander-balance',
        sabotage: 'sabotage-command-evidence',
        assault: 'assault-command-evidence',
        raid: 'raid-command-evidence',
        extraction: 'extraction-objective-evidence',
]

tasks.register('commanderEvidence', Test) {
    group = 'verification'
    description = 'Run forced-serial commander evidence selected with -Pmission=<mission>.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags commanderEvidenceTags.getOrDefault(
                commanderEvidenceMission, 'invalid-commander-evidence-mission')
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.unitUpdate.minimumParallelUnits', Integer.MAX_VALUE.toString()
    if (commanderEvidenceTags.containsKey(commanderEvidenceMission)) {
        def prefix = [
                conquest: 'commander.balance',
                sabotage: 'sabotage.command.evidence',
                assault: 'assault.command.evidence',
                raid: 'raid.command.evidence',
                extraction: 'extraction.objective.evidence',
        ][commanderEvidenceMission]
        systemProperty "${prefix}.outputDir",
                layout.buildDirectory.dir(
                        "reports/commander/${commanderEvidenceMission}")
                        .get().asFile.absolutePath
        def fixture = providers.gradleProperty('fixture')
                .orElse(providers.systemProperty('commander.evidence.fixture.path'))
                .getOrElse('').trim()
        def maxTicks = providers.gradleProperty('maxTicks')
                .orElse(providers.systemProperty('commander.evidence.maxTicks'))
                .getOrElse('').trim()
        if (!fixture.isBlank()) {
            systemProperty "${prefix}.fixture.path", fixture
        }
        if (!maxTicks.isBlank()) {
            systemProperty "${prefix}.maxTicks", maxTicks
        }
    }
    doFirst {
        if (!commanderEvidenceTags.containsKey(commanderEvidenceMission)) {
            throw new GradleException(
                    'commanderEvidence requires -Pmission=conquest, sabotage, assault, raid, or extraction')
        }
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('profileBattleFixture', Test) {
    group = 'verification'
    description = 'Replay a battle fixture headlessly and record its ticks with JFR.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'battle-profile'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.profile.outputDir', layout.buildDirectory.dir('profiles').get().asFile.absolutePath
    systemProperty 'battle.profile.pathRequests', 'true'
    def selectedFixture = System.getProperty('battle.fixture.path', '')
    if (!selectedFixture.isBlank()) {
        systemProperty 'battle.fixture.path', selectedFixture
    }
    ['battle.profile.warmupTicks', 'battle.profile.prerollTicks',
     'battle.profile.sliceTicks', 'battle.profile.minimumMillis',
     'battle.unitUpdate.minimumParallelUnits',
     'battle.pathfinding.sharedSwarmGoals',
     'battle.pathfinding.minimumSharedGoalUnits'].each { propertyName ->
        def propertyValue = System.getProperty(propertyName, '')
        if (!propertyValue.isBlank()) {
            systemProperty propertyName, propertyValue
        }
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('createSnapshots', JavaExec) {
    group = 'verification'
    description = 'Create deterministic visual snapshots without launching Starsector'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.ops.CreateSnapshotsCli'
    workingDir projectDir
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    outputs.upToDateWhen { false }
    doFirst {
        File output = providers.gradleProperty('snapshotDir').isPresent()
                ? file(providers.gradleProperty('snapshotDir').get())
                : layout.buildDirectory.dir('snapshots').get().asFile
        String selector = providers.gradleProperty('snapshot').getOrElse('all')
        args projectDir.absolutePath, starsectorCore.absolutePath,
                output.absolutePath, selector
    }
}

tasks.register('layerAuthoring', JavaExec) {
    group = 'development'
    description = 'Launch the standalone marine/mech layer authoring workbench'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.tools.layerauthoring.LayerAuthoringWorkbench'
    workingDir projectDir
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    args projectDir.absolutePath
}

// The default `jar` task only produces the thin jar (our classes), which we
// don't ship. The shaded `shadowJar` below is the deliverable — it bundles
// asset-pipeline + JOML + fastutil (relocated) into mod/jars/StarsectorMarines.jar.
jar {
    enabled = false
}

shadowJar {
    dependsOn ':asset-pipeline:jar'
    archiveBaseName = modName
    archiveClassifier = ''
    archiveVersion = ''
    destinationDirectory = modJarsDir

    // Relocate fastutil so we ship our own copy without colliding with other
    // mods. Source still uses `it.unimi.dsi.fastutil.*` imports; the rewrite
    // happens at jar time on bytecode.
    relocate 'it.unimi.dsi.fastutil', 'com.dillon.starsectormarines.shaded.fastutil'

    // Drop fastutil classes we don't actually reference. fastutil's full type-
    // specialization matrix is huge; minimize() keeps only what our bytecode
    // touches plus its transitive closure, which is typically a small fraction.
    minimize()

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
}

// Wire the shaded jar into the standard build lifecycle so `gradlew build`
// produces the mod jar without needing to name `shadowJar` explicitly.
tasks.named('assemble').configure { dependsOn tasks.named('shadowJar') }

tasks.register('deployMod', Sync) {
    group = 'starsector'
    description = "Copy the mod folder into the Starsector mods directory ($starsectorModsDir)"
    // mod/sounds is generated and gitignored. Always materialize the audio
    // manifest before Sync snapshots mod/, otherwise a newly-added sound ID
    // can deploy without its matching Ogg and make Starsector fail at startup.
    dependsOn tasks.named('shadowJar'), ':asset-pipeline:processAudio'
    from modOutputDir
    into new File(starsectorModsDir, modName)
    preserve {
        // Saves and logs the user might drop in the mod folder while testing.
        include '.git/**'
    }
}

tasks.register('undeployMod', Delete) {
    group = 'starsector'
    description = "Remove the deployed mod from $starsectorModsDir"
    delete new File(starsectorModsDir, modName)
}

tasks.register('runStarsector', Exec) {
    group = 'starsector'
    description = 'Launch Starsector after deploying the mod'
    dependsOn 'deployMod'
    workingDir new File(starsectorDir, 'starsector-core')
    commandLine 'cmd', '/c', 'starsector.bat'
}

def catalogSmokeMode = providers.gradleProperty('catalogSmokeMode').orElse('additive')
def catalogSmokeRoot = layout.buildDirectory.dir('catalog-smoke')

tasks.register('prepareCatalogSmoke', Sync) {
    group = 'verification'
    description = 'Stage isolated Starsector Marines catalog-provider smoke-test mods'
    dependsOn tasks.named('shadowJar'), ':asset-pipeline:processAudio'
    outputs.upToDateWhen { false }

    doFirst {
        if (!(catalogSmokeMode.get() in ['additive', 'collision'])) {
            throw new GradleException("catalogSmokeMode must be 'additive' or 'collision'")
        }
    }

    into catalogSmokeRoot.map { it.dir("${catalogSmokeMode.get()}/mods") }
    from(modOutputDir) { into modName }
    from('src/liveTest/catalog-smoke/provider-alpha') { into 'CatalogSmokeAlpha' }
    from({ file("src/liveTest/catalog-smoke/provider-beta-${catalogSmokeMode.get()}") }) {
        into 'CatalogSmokeBeta'
    }

    doLast {
        File modsDir = catalogSmokeRoot.get().dir("${catalogSmokeMode.get()}/mods").asFile
        new File(modsDir, 'enabled_mods.json').text =
                '{"enabledMods":["starsector_marines","catalog_smoke_alpha","catalog_smoke_beta"]}\n'
    }
}

tasks.register('catalogSmokeLive', Exec) {
    group = 'verification'
    description = 'Launch the installed Starsector game once against isolated two-provider catalog fixtures'
    dependsOn tasks.named('prepareCatalogSmoke')
    workingDir projectDir
    standardOutput = System.out
    errorOutput = System.err
    doFirst {
        commandLine 'pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', file('tools/catalog-smoke/run-catalog-smoke.ps1').absolutePath,
                '-ProjectDir', projectDir.absolutePath,
                '-StarsectorDir', starsectorDir.absolutePath,
                '-Mode', catalogSmokeMode.get()
    }
}

clean {
    delete modJarsDir
}
