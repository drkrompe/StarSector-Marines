// Regenerates every story map pool's seeds (story-map-pools.md) and fails when one no
// longer meets its mission's acceptance, so a mapgen change that breaks a pooled map is
// caught rather than shipped. -Pcandidates=cordon-line:1-40,heart-burn:1-20 screens seeds
// that are not pooled yet and reports them without failing. Generates whole maps: opt-in.
tasks.register('storyMapPools', Test) {
    group = 'verification'
    description = 'Regenerate every pooled story-map seed and check its acceptance; opt-in, excluded from test.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'story-map-pool-evidence'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'storyMapPools.candidates', providers.gradleProperty('candidates').getOrElse('')
    systemProperty 'storyMapPools.parallelism', providers.gradleProperty('parallelism')
            .getOrElse(String.valueOf(Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))))
    systemProperty 'storyMapPools.outputDir',
            providers.gradleProperty('evidenceDir').getOrElse(layout.buildDirectory.dir('reports/story-map-pools').get().asFile.absolutePath)
    testLogging {
        showStandardStreams = true
    }
}

