plugins {
    id 'java'
    // Bundles runtime deps and rewrites their packages so they can't collide
    // with other mods' copies. fastutil in particular: the game's classloader
    // is shared, so an unrelocated copy would fight other mods that ship
    // their own version.
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.dillon.starsectormarines'
version = '0.0.1'

def starsectorDir = file(providers.gradleProperty('starsectorDir').get())
def starsectorCore = new File(starsectorDir, 'starsector-core')
def starsectorModsDir = new File(starsectorDir, 'mods')

def modName = 'StarsectorMarines'
def modId   = 'starsector_marines' // must match StarsectorMarinesModPlugin.MOD_ID
def modOutputDir = file("$projectDir/mod")
def modJarsDir = new File(modOutputDir, 'jars')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    flatDir {
        dirs starsectorCore
    }
}

configurations {
    starsector
}

dependencies {
    // Starsector runtime — provided by the game, never bundled into our jar.
    compileOnly files(
            new File(starsectorCore, 'starfarer.api.jar'),
            new File(starsectorCore, 'starfarer_obf.jar'),
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
            new File(starsectorCore, 'json.jar'),
            new File(starsectorCore, 'log4j-1.2.9.jar'),
            new File(starsectorCore, 'xstream-1.4.10.jar'),
            new File(starsectorCore, 'fs.common_obf.jar'),
    )

    // Asset-pipeline runtime classes (mesh data, model serializer, scene/skeleton/animation PODs).
    // Bundled into the mod jar via the fat-jar config below.
    implementation project(':asset-pipeline')

    // fastutil-core: primitive-keyed maps/sets for hot AI/sim paths (squad lookup,
    // crowding tables, zone ids). Shaded into our own namespace via shadowJar's
    // relocate rule below so it can't collide with another mod's copy on the
    // shared classloader.
    implementation "it.unimi.dsi:fastutil-core:${fastutilVersion}"

    // Lombok — same convention as the asset-pipeline module so shared style works.
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(':layer-authoring')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation files(
            new File(starsectorCore, 'starfarer.api.jar'),
            new File(starsectorCore, 'json.jar'),
            new File(starsectorCore, 'log4j-1.2.9.jar'),
    )
    // Campaign API interfaces expose LWJGL vector types in method signatures.
    // Keep them available to reflection-based API fakes without bundling them.
    testRuntimeOnly files(
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
    )
    // `shaderEvidence` makes a real GL context (HeadlessGl) and drives the mod's
    // own render classes through it, so the test sources need LWJGL 2 to COMPILE
    // against as well. compileOnly, exactly as `main` has it: the game supplies
    // the jar at runtime and it must never enter the shipped one.
    testCompileOnly files(
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
    )
}

// Every Test task here runs the same test source set, so every one of them
// loads the shipped catalogs up front and can reach the headless renderers.
// Gradle defaults a Test task to 512m, which those sit right on the edge of:
// mod/graphics is 23MB of PNG on disk but decodes to far more, since a
// 1254x1254 sheet alone is 6MB of ARGB once it is a BufferedImage, and the
// ~620 classes share one JVM (maxParallelForks = 1, no forkEvery) whose sprite
// caches live as long as it does. The symptom is not an obvious one - ImageIO
// wraps the OutOfMemoryError as an ordinary IIOException, so it surfaces as an
// unrelated sheet "failing to read", and only when a sibling session is
// competing for the machine. A cap, not a reservation, so idle runs cost
// nothing. Set once for all Test tasks rather than per task: two sessions
// diagnosing this independently both added it to `test` alone, leaving the
// value duplicated there and still missing from `commanderEvidence`, which
// renders review frames through the very renderer that was running out.
tasks.withType(Test).configureEach {
    maxHeapSize = '2g'
    // A repeated implicit exception loses its stack to the JIT's fast-throw
    // optimisation, and an evidence run that dies after thirteen minutes with a
    // bare `java.lang.ArrayIndexOutOfBoundsException` and no frames is a run that
    // has to be paid for again to say anything. Keep the frames.
    jvmArgs '-XX:-OmitStackTraceInFastThrow'
    // Every JVM-side measurement — the suite, commander evidence, snapshots —
    // measures shipping behaviour, never the debug scaffold. Without this,
    // IntegralSystemSystem's screen-trigger override would raise a screen in
    // every scene, the policy tests would be asserting nothing, and evidence
    // runs would report a battle nobody can play.
    systemProperty 'marines.debug.screenTrigger', 'off'
    // Keep evidence and ordinary tests deterministic even though live battles
    // use async rally routes and influence propagation. Profile A/B can opt in.
    systemProperty 'battle.pathfinding.asyncDefendTrack',
            System.getProperty('battle.pathfinding.asyncDefendTrack', 'false')
    systemProperty 'battle.pathfinding.asyncClearance',
            System.getProperty('battle.pathfinding.asyncClearance', 'false')
    systemProperty 'battle.influence.async',
            System.getProperty('battle.influence.async', 'false')
    forwardBattleSwitches(delegate)
}

// A `-Dbattle.*` switch on the command line reaches the Gradle daemon and stops
// there; the fork that runs the measurement never sees it. Forwarding them is
// what makes a control run — the same evidence with one routing or pathfinding
// layer switched off — a single command rather than a checkout of an older
// commit, which would measure every other difference between the two trees at
// the same time.
void forwardBattleSwitches(task) {
    System.properties.each { key, value ->
        if (key.toString().startsWith('battle.')) {
            task.systemProperty key.toString(), value
        }
    }
}

test {
    useJUnitPlatform {
        excludeTags 'battle-profile', 'battle-tail-profile', 'convoy-route-evidence',
                'commander-balance',
                'sabotage-command-evidence', 'assault-command-evidence',
                'raid-command-evidence', 'extraction-command-evidence',
                'crew-liveliness', 'shader-evidence', 'render-evidence'
    }
    testLogging {
        // Audit-style tests print their report to stdout — stream it to the
        // gradle console so devs don't have to dig through the XML report.
        showStandardStreams = true
    }
    // EngineSlotPreviewTest loads vanilla .ship files + sprites from the
    // game install; forward the project-level `starsectorDir` gradle property
    // so the test can find them. Same source of truth the build.gradle root
    // uses for compileOnly + deployMod (resolved at line 13).
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    // ProjectTilesetSeedsTest reads the checked-in tileset seeds at runtime, so
    // Gradle cannot see them as inputs and happily reports UP-TO-DATE after a
    // seed is added or edited - which silently disarms the check that every raw
    // sheet arrives annotated. Declare them.
    inputs.dir('art-source/tilesets')
            .withPropertyName('tilesetSeeds')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // The shipped catalogs and art are read off disk at runtime too, and by far
    // more tests: TileRegistryTestInstaller loads every builtin catalog before
    // any test runs, and the preview/tools tests read the real sheets. Edit a
    // `.tileset.json` or a sheet without these and gradle reports UP-TO-DATE
    // with the change unverified. Declare `mod/data` and `mod/graphics` only -
    // `mod/jars` and `mod/sounds` are outputs of shadowJar and deployMod, so
    // including them would make `:test` stale on every single build.
    inputs.dir('mod/data')
            .withPropertyName('shippedCatalogs')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('mod/graphics')
            .withPropertyName('shippedArt')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // DerivedReliefFollowsItsAtlasTest reads the derivation manifest to learn
    // which sheets have relief baked for them. It is the bake's inclusion list,
    // so adding a sheet to it widens the check - and without this, gradle
    // reports UP-TO-DATE and the new sheet is never looked at.
    inputs.file('asset-pipeline/src/tool/resources/tilemaps/tilemaps.json')
            .withPropertyName('tileMapManifest')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // Same hazard, different root: CatalogSmokeFixtureTest reads the staged
    // two-provider fixture straight out of the source tree rather than off the
    // test classpath, so gradle cannot see it either.
    inputs.dir('src/liveTest/catalog-smoke')
            .withPropertyName('catalogSmokeFixture')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // Opt-in gate for the ecs-migration Phase-0 access micro-bench
    // (EcsAccessBenchTest). Off by default so the normal suite stays fast for
    // concurrent sessions; run on demand with `-Decs.bench=true`.
    systemProperty 'ecs.bench', System.getProperty('ecs.bench', 'false')
}

def commanderEvidenceMission = providers.gradleProperty('mission')
        .orElse(providers.systemProperty('commander.evidence.mission'))
        .getOrElse('').trim().toLowerCase()
def commanderEvidenceTags = [
        conquest: 'commander-balance',
        sabotage: 'sabotage-command-evidence',
        assault: 'assault-command-evidence',
        raid: 'raid-command-evidence',
        extraction: 'extraction-command-evidence',
]

// Crewing two whole hulls and running each for four minutes of ship's time is
// minutes of wall clock, so it is opt-in like the rest of the evidence. What it
// answers is whether anybody aboard is standing about with nothing to do - see
// CrewLivelinessEvidence for why a corpse counts as exactly that.
tasks.register('crewEvidence', Test) {
    group = 'verification'
    description = 'Measure what a manned ship spends her time doing; opt-in, excluded from test.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'crew-liveliness'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    testLogging {
        showStandardStreams = true
    }
}

// The only evidence here that makes a real OpenGL context. Everything else
// headless -- the snapshot suites, the shader pixel oracles -- draws through
// Java2D or models GLSL on the CPU, which is blind to the ways a shader really
// fails: a driver rejecting a construct, or a uniform set under a name the
// linked program does not have (which is silent, by specification). Opt-in and
// excluded from `test` because it needs an accelerated driver, and a suite that
// requires a GPU is a suite that fails on the machine that has none.
//
// LWJGL 2, deliberately: the mod's render classes are written against it, so
// this runs them rather than a re-implementation of them. The jar is already on
// the test runtime classpath and HeadlessGl finds the natives beside the game
// through `starsectorDir`, so there is nothing new to install.
tasks.register('shaderEvidence', Test) {
    group = 'verification'
    description = 'Compile and link every mod shader on a real driver; opt-in, excluded from test.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'shader-evidence'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    testLogging {
        showStandardStreams = true
    }
}

// What a frame costs, per render layer, at three framings on the map the owner
// plays and on the one the renderer was built for. Like `shaderEvidence` it
// runs on a real driver through HeadlessGl -- because the question is about the
// shipping collect and the shipping drain, and the Java2D review renderer is a
// re-implementation of the painting that could not report a texture bind if it
// wanted to. Opt-in and excluded from `test` for the same reason: a suite that
// requires a GPU fails on the machine that has none, so where no context can be
// made this reports that it skipped.
tasks.register('renderEvidence', Test) {
    group = 'verification'
    description = 'Profile the real render pipeline per layer at three framings; opt-in, excluded from test.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'render-evidence'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    // The profile plays 600 ticks before it draws anything, so the world it
    // measures is whatever that playout produced. Under the production
    // scheduler that is a different world every run -- the same fixture on
    // unchanged code collected 496, 567 and 537 UNITS commands on three runs --
    // and the existing frame-to-frame assertion cannot see it, because within
    // one run the world is still. Forced serial, the way `commanderEvidence`
    // and `simDeterminism` already are, for the same reason: a count that does
    // not repeat run to run cannot be compared against a control.
    systemProperty 'battle.unitUpdate.minimumParallelUnits', Integer.MAX_VALUE.toString()
    if (project.hasProperty('renderMaxTicks')) {
        systemProperty 'render.evidence.maxTicks', project.property('renderMaxTicks')
    }
    if (project.hasProperty('renderFrames')) {
        systemProperty 'render.evidence.frames', project.property('renderFrames')
    }
    if (project.hasProperty('renderDir')) {
        systemProperty 'render.evidence.outputDir', project.property('renderDir')
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('commanderEvidence', Test) {
    group = 'verification'
    description = 'Run forced-serial commander evidence selected with -Pmission=<mission>.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags commanderEvidenceTags.getOrDefault(
                commanderEvidenceMission, 'invalid-commander-evidence-mission')
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.unitUpdate.minimumParallelUnits', Integer.MAX_VALUE.toString()
    if (commanderEvidenceTags.containsKey(commanderEvidenceMission)) {
        def prefix = [
                conquest: 'commander.balance',
                sabotage: 'sabotage.command.evidence',
                assault: 'assault.command.evidence',
                raid: 'raid.command.evidence',
                extraction: 'extraction.command.evidence',
        ][commanderEvidenceMission]
        systemProperty "${prefix}.outputDir",
                layout.buildDirectory.dir(
                        "reports/commander/${commanderEvidenceMission}")
                        .get().asFile.absolutePath
        def fixture = providers.gradleProperty('fixture')
                .orElse(providers.systemProperty('commander.evidence.fixture.path'))
                .getOrElse('').trim()
        def maxTicks = providers.gradleProperty('maxTicks')
                .orElse(providers.systemProperty('commander.evidence.maxTicks'))
                .getOrElse('').trim()
        if (!fixture.isBlank()) {
            systemProperty "${prefix}.fixture.path", fixture
        }
        if (!maxTicks.isBlank()) {
            systemProperty "${prefix}.maxTicks", maxTicks
        }
        def repeat = providers.gradleProperty('repeat')
                .orElse(providers.systemProperty('commander.evidence.repeat'))
                .getOrElse('').trim()
        def parallelism = providers.gradleProperty('parallelism')
                .orElse(providers.systemProperty('commander.evidence.parallelism'))
                .getOrElse('').trim()
        if (!repeat.isBlank()) {
            systemProperty 'commander.evidence.repeat', repeat
        }
        if (!parallelism.isBlank()) {
            systemProperty 'commander.evidence.parallelism', parallelism
        }
        def visualArguments = [
                snapshotEveryTicks: 'commander.evidence.snapshot.everyTicks',
                gifFrameDelayMillis: 'commander.evidence.snapshot.frameDelayMillis',
                snapshotWidth: 'commander.evidence.snapshot.width',
                snapshotHeight: 'commander.evidence.snapshot.height',
                snapshotAnnotations: 'commander.evidence.snapshot.annotations',
        ]
        visualArguments.each { argument, property ->
            def value = providers.gradleProperty(argument)
                    .orElse(providers.systemProperty(property))
                    .getOrElse('').trim()
            if (!value.isBlank()) systemProperty property, value
        }
    }
    doFirst {
        if (!commanderEvidenceTags.containsKey(commanderEvidenceMission)) {
            throw new GradleException(
                    'commanderEvidence requires -Pmission=conquest, sabotage, assault, raid, or extraction')
        }
    }
    testLogging {
        showStandardStreams = true
    }
}

// The determinism check that used to ride along on every balance run. Replaying
// the whole matrix twice, serially, to end in an equals() is most of what a
// commander-evidence run cost, and none of it was evidence about the battle.
// What the check actually needs is one fixture and a few thousand ticks.
//
// The replicas run side by side, which asks a second question the serial form
// never could: whether two simulations in one JVM see each other. They did,
// twice over, and this probe is what found both - LosCache's enable flag and
// clearAll sweep were process-global rather than per sim, and the shared map
// generator handed one battle the map another had just finished. The caches now
// belong to the NavigationGrid whose topology invalidates them, and a MapResult
// is composed from its own context. `-Pparallelism=1` is the serial control.
tasks.register('simDeterminism', Test) {
    group = 'verification'
    description = 'Replay the conquest matrix twice for a bounded tick budget and fail on the first byte that differs.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'commander-balance'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.unitUpdate.minimumParallelUnits', Integer.MAX_VALUE.toString()
    systemProperty 'commander.evidence.repeat', '2'
    systemProperty 'commander.evidence.parallelism',
            providers.gradleProperty('parallelism')
                    .orElse(providers.systemProperty(
                            'commander.evidence.parallelism'))
                    .getOrElse(Math.max(1,
                            Runtime.runtime.availableProcessors().intdiv(2))
                            .toString())
                    .trim()
    systemProperty 'commander.balance.maxTicks',
            providers.gradleProperty('maxTicks').getOrElse('3000').trim()
    systemProperty 'commander.balance.outputDir',
            layout.buildDirectory.dir('reports/sim-determinism')
                    .get().asFile.absolutePath
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('profileBattleFixture', Test) {
    group = 'verification'
    description = 'Replay a battle fixture headlessly and record its ticks with JFR.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'battle-profile'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.profile.outputDir', layout.buildDirectory.dir('profiles').get().asFile.absolutePath
    systemProperty 'battle.profile.pathRequests', 'true'
    def selectedFixture = System.getProperty('battle.fixture.path', '')
    if (!selectedFixture.isBlank()) {
        systemProperty 'battle.fixture.path', selectedFixture
    }
    ['battle.profile.warmupTicks', 'battle.profile.prerollTicks',
     'battle.profile.sliceTicks', 'battle.profile.minimumMillis',
     'battle.unitUpdate.minimumParallelUnits',
     'battle.pathfinding.sharedGoalFields',
     'battle.pathfinding.minimumSharedGoalUnits',
     'battle.pathfinding.squadRouteCorridors',
     'battle.pathfinding.maxSquadRouteBuildsPerTick',
     'battle.pathfinding.casualtyRouteCost'].each { propertyName ->
        def propertyValue = System.getProperty(propertyName, '')
        if (!propertyValue.isBlank()) {
            systemProperty propertyName, propertyValue
        }
    }
    testLogging {
        showStandardStreams = true
    }
}

// A production-scheduler Conquest tail pass. Unlike the JFR drill-down above,
// this plays one continuous battle age and retains the complete diagnostic
// context of its slowest individual ticks. Timing is evidence, not a portable
// pass/fail budget.
tasks.register('profileConquestTail', Test) {
    group = 'verification'
    description = 'Replay a large Conquest headlessly and report worst-tick diagnostics.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'battle-tail-profile' }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.fixture.path', System.getProperty('battle.fixture.path',
            file('src/test/resources/battle-fixtures/conquest-full-strength-west-v3.json').absolutePath)
    systemProperty 'battle.pathfinding.asyncDefendTrack',
            System.getProperty('battle.pathfinding.asyncDefendTrack', 'true')
    systemProperty 'battle.pathfinding.asyncClearance',
            System.getProperty('battle.pathfinding.asyncClearance', 'true')
    systemProperty 'battle.influence.async',
            System.getProperty('battle.influence.async', 'true')
    systemProperty 'battle.unitUpdate.minimumParallelUnits',
            System.getProperty('battle.unitUpdate.minimumParallelUnits', '48')
    systemProperty 'battle.tail.outputDir', System.getProperty('battle.tail.outputDir',
            layout.buildDirectory.dir('reports/performance/conquest-tail').get().asFile.absolutePath)
    // Prefer the game's own Java 17 runtime when present. The build can use a
    // newer JDK, but tail timing is more useful when the test fork matches the
    // runtime that ships the battle. Explicit override supports other installs.
    def requestedJava = System.getProperty('battle.tail.javaExecutable', '').trim()
    def gameJava = requestedJava ? file(requestedJava) : [
            new File(starsectorDir, 'Contents/Home/bin/java'),
            new File(starsectorDir, 'jre/bin/java.exe'),
            file('/Applications/Starsector.app/Contents/Home/bin/java')
    ].find { it.isFile() }
    if (gameJava != null) {
        if (!gameJava.isFile()) throw new GradleException("Missing battle tail Java: ${gameJava}")
        executable = gameJava.absolutePath
    }
    ['battle.tail.totalTicks', 'battle.tail.warmupTicks',
     'battle.tail.paceMillis', 'battle.tail.topTicks',
     'battle.tail.jfr', 'battle.tail.convoyUncachedStages'].each { propertyName ->
        def propertyValue = System.getProperty(propertyName, '')
        if (!propertyValue.isBlank()) systemProperty propertyName, propertyValue
    }
    testLogging { showStandardStreams = true }
}

// Isolated route proof on generated full-size Conquest maps. It measures the
// actual entrance/drop/exit decision without depending on battle timing to
// select convoy as the reinforcement means during a replay.
tasks.register('profileConvoyRoute', Test) {
    group = 'verification'
    description = 'Measure progressive convoy proof coverage and worst step on large Conquest maps.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'convoy-route-evidence' }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.convoyRoute.outputDir', System.getProperty(
            'battle.convoyRoute.outputDir',
            layout.buildDirectory.dir('reports/performance/convoy-route').get().asFile.absolutePath)
    testLogging { showStandardStreams = true }
}

tasks.register('profileClearanceRoute', JavaExec) {
    group = 'verification'
    description = 'Measure circular-clearance routes and competing requests on synthetic and generated battle terrain.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.battle.nav.ClearanceRouteEvidenceCli'
    workingDir projectDir
    outputs.upToDateWhen { false }
    args layout.buildDirectory.dir('reports/performance/clearance-route').get().asFile.absolutePath
}

tasks.register('createSnapshots', JavaExec) {
    group = 'verification'
    description = 'Create deterministic visual snapshots without launching Starsector'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.ops.CreateSnapshotsCli'
    workingDir projectDir
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.influence.async', 'false'
    systemProperty 'battle.pathfinding.asyncClearance', 'false'
    forwardBattleSwitches(delegate)
    outputs.upToDateWhen { false }
    doFirst {
        File output = providers.gradleProperty('snapshotDir').isPresent()
                ? file(providers.gradleProperty('snapshotDir').get())
                : layout.buildDirectory.dir('snapshots').get().asFile
        String selector = providers.gradleProperty('snapshot').getOrElse('all')
        args projectDir.absolutePath, starsectorCore.absolutePath,
                output.absolutePath, selector
    }
}

// The behaviour scenes already play under `createSnapshots`, but rendering is
// the slow part of that run and a GIF cannot fail: a scene whose finding has
// regressed still produces a perfectly good animation of the regression. This
// plays the same catalog with no renderer attached and turns the verdicts into
// an exit status, so a scene's answer can gate something. Opt-in for the reason
// every other evidence task here is: it plays whole battles, which is evidence
// rather than a unit test, and belongs nowhere near `test` or `check`.
tasks.register('sceneEvidence', JavaExec) {
    group = 'verification'
    description = 'Play the behaviour scenes for their verdicts and report PASS/FAIL'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.battle.scene.SceneEvidenceCli'
    workingDir projectDir
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.influence.async', 'false'
    systemProperty 'battle.pathfinding.asyncClearance', 'false'
    forwardBattleSwitches(delegate)
    outputs.upToDateWhen { false }
    doFirst {
        File output = providers.gradleProperty('sceneDir').isPresent()
                ? file(providers.gradleProperty('sceneDir').get())
                : layout.buildDirectory.dir('reports/scenes').get().asFile
        String selector = providers.gradleProperty('scene').getOrElse('all')
        args projectDir.absolutePath, starsectorCore.absolutePath,
                output.absolutePath, selector
    }
}

tasks.register('layerAuthoring', JavaExec) {
    group = 'development'
    description = 'Launch the standalone marine/mech layer authoring workbench'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dillon.starsectormarines.tools.layerauthoring.LayerAuthoringWorkbench'
    workingDir projectDir
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    systemProperty 'battle.influence.async', 'false'
    args projectDir.absolutePath
}

// The authoring tools have two front doors, and neither of them can be a Gradle
// task. An MCP client spawns its stdio server and owns the pipe, so the server
// has to be `java`, not `gradlew`: JavaExec's streams pass through the daemon,
// whose stdin forwarding is unreliable and whose stdout would put build chatter
// on the wire. The one-shot CLI has to be `java` for a duller reason — a call
// that pays for a daemon handshake is not a shell command anyone will reach for.
//
// So this task installs launchers rather than being one: it resolves the tool
// classpath into an argument file and writes the scripts. Re-run it after a
// dependency change or a `clean`. The checked-in wrappers, tools/authoring.sh and tools/authoring.cmd,
// run it for you when the output is missing.
tasks.register('installAuthoringTools') {
    group = 'development'
    description = 'Write the launchers that run the authoring tools headlessly'
    dependsOn tasks.named('testClasses')

    def outputDir = layout.buildDirectory.dir('authoring')
    def toolClasspath = sourceSets.test.runtimeClasspath
    def coreDir = starsectorCore
    // Resolved here rather than read from JAVA_HOME at run time: these scripts
    // are invoked from whatever shell a session happens to hold, and a launcher
    // that works only in a shell someone remembered to prepare is the setup
    // step this whole entry point exists to remove.
    def javaExecutable = javaToolchains.launcherFor(java.toolchain)
            .map { it.executablePath.asFile.absolutePath }
    inputs.files(toolClasspath)
    outputs.dir(outputDir)

    doLast {
        File output = outputDir.get().asFile
        output.mkdirs()

        // A resolved Windows classpath is long enough to blow the command-line
        // limit, and @argfile is the supported way past it. Forward slashes are
        // not cosmetic: inside a quoted @argfile entry the JDK treats a
        // backslash as an escape, so a native Windows path silently loses every
        // separator and the class is then "not found" for no visible reason.
        String classpath = toolClasspath.files*.absolutePath
                .collect { it.replace('\\', '/') }
                .join(File.pathSeparator)
        File argsFile = new File(output, 'classpath.args')
        // These launchers can run the deterministic snapshot catalog in-process.
        argsFile.text = ('-Dbattle.influence.async=false' + System.lineSeparator()
                + '-classpath "' + classpath + '"' + System.lineSeparator())

        String java = javaExecutable.get()
        String argfile = '"@' + argsFile.absolutePath + '"'
        String roots = ' "' + projectDir.absolutePath + '" "' + coreDir.absolutePath + '"'

        // Each generated launcher runs whatever is in build/classes right now.
        // None of them checks that against the sources, and none of them can:
        // only Gradle knows the answer. That is why the checked-in wrappers in
        // tools/ run this task before handing over, and why every one of these
        // says so — reaching past a wrapper to a launcher is what silently ran
        // pre-guard classes over a hand-cut tileset once already.
        String staleWarning =
                'rem Runs the classes compiled last - it does NOT check they are current.'
        File server = new File(output, 'starsector-authoring-mcp.cmd')
        server.text = ([
                '@echo off',
                'rem Generated by gradlew.bat installAuthoringTools - do not edit.',
                staleWarning,
                'rem Register tools\\authoring-mcp.cmd in .mcp.json instead of this file.',
                '"' + java + '" ' + argfile
                        + ' com.dillon.starsectormarines.ops.AuthoringMcpCli' + roots,
        ].join('\r\n')) + '\r\n'

        File batch = new File(output, 'authoring.cmd')
        batch.text = ([
                '@echo off',
                'rem Generated by gradlew.bat installAuthoringTools - do not edit.',
                staleWarning,
                'rem Call tools\\authoring.cmd instead of this file.',
                '"' + java + '" ' + argfile
                        + ' com.dillon.starsectormarines.ops.AuthoringToolCli' + roots + ' %*',
        ].join('\r\n')) + '\r\n'

        // Forward slashes throughout: this runs under Git Bash, where a
        // backslash is an escape character rather than a separator.
        String posixJava = java.replace('\\', '/')
        File shell = new File(output, 'authoring.sh')
        shell.text = ([
                '#!/bin/sh',
                '# Generated by gradlew.bat installAuthoringTools - do not edit.',
                '# Runs the classes compiled last - it does NOT check they are current.',
                '# Call tools/authoring.sh instead of this file.',
                'exec "' + posixJava + '" "@' + argsFile.absolutePath.replace('\\', '/') + '" \\',
                '  com.dillon.starsectormarines.ops.AuthoringToolCli \\',
                '  "' + projectDir.absolutePath.replace('\\', '/') + '" \\',
                '  "' + coreDir.absolutePath.replace('\\', '/') + '" "$@"',
        ].join('\n')) + '\n'
        shell.setExecutable(true)

        logger.lifecycle('Wrote ' + batch.absolutePath + ' and ' + shell.absolutePath)
        logger.lifecycle('Call a tool from any shell:')
        logger.lifecycle('  tools/authoring.sh tileset_list')
        logger.lifecycle('')
        // The snippet names the checked-in wrapper, never the launcher it
        // execs: the wrapper is what rebuilds first, so a session does not
        // start a server on classes of unknown age.
        logger.lifecycle('For a session that registers MCP servers up front, add to '
                + new File(projectDir, '.mcp.json').absolutePath + ':')
        logger.lifecycle('{"mcpServers":{"starsector-authoring":{"command":"'
                + new File(projectDir, 'tools/authoring-mcp.cmd').absolutePath.replace('\\', '/')
                + '","args":[]}}}')
    }
}

// The default `jar` task only produces the thin jar (our classes), which we
// don't ship. The shaded `shadowJar` below is the deliverable — it bundles
// asset-pipeline + JOML + fastutil (relocated) into mod/jars/StarsectorMarines.jar.
jar {
    enabled = false
}

shadowJar {
    dependsOn ':asset-pipeline:jar'
    archiveBaseName = modName
    archiveClassifier = ''
    archiveVersion = ''
    destinationDirectory = modJarsDir

    // Relocate fastutil so we ship our own copy without colliding with other
    // mods. Source still uses `it.unimi.dsi.fastutil.*` imports; the rewrite
    // happens at jar time on bytecode.
    relocate 'it.unimi.dsi.fastutil', 'com.dillon.starsectormarines.shaded.fastutil'

    // Drop fastutil classes we don't actually reference. fastutil's full type-
    // specialization matrix is huge; minimize() keeps only what our bytecode
    // touches plus its transitive closure, which is typically a small fraction.
    minimize()

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
}

// "Tool and test infrastructure must not enter the shipped mod jar" is a rule
// this repository states in several places and has so far enforced by someone
// remembering to unzip the jar and look. It is exactly the kind of rule that
// holds until the day a tool class acquires an innocent-looking import.
//
// The forbidden set is computed rather than listed: everything on the tool
// runtime classpath that is not also on the shipped runtime classpath is, by
// construction, tool-only — the authoring workbench, the MCP host, JUnit, and
// the game's own jars, which the game provides and we must never bundle. A new
// tool dependency is therefore covered the moment it is added, with no list to
// keep in step.
tasks.register('verifyModJarBoundary') {
    group = 'verification'
    description = 'Fail if tool/test-only code reached the shipped mod jar'
    dependsOn tasks.named('shadowJar')

    def shipped = tasks.named('shadowJar').flatMap { it.archiveFile }
    def toolClasspath = sourceSets.test.runtimeClasspath
    def shippedClasspath = sourceSets.main.runtimeClasspath
    inputs.file(shipped)
    inputs.files(toolClasspath)

    doLast {
        Set<String> allowed = classEntries(shippedClasspath)
        Set<String> forbidden = classEntries(toolClasspath)
        forbidden.removeAll(allowed)

        List<String> leaked = []
        new java.util.zip.ZipFile(shipped.get().asFile).withCloseable { archive ->
            archive.entries().each { entry ->
                if (forbidden.contains(entry.name)) leaked.add(entry.name)
            }
        }
        if (!leaked.isEmpty()) {
            throw new GradleException("tool/test-only classes reached "
                    + shipped.get().asFile.name + ":\n  "
                    + leaked.sort().take(20).join('\n  ')
                    + (leaked.size() > 20 ? "\n  ... and " + (leaked.size() - 20) + " more" : "")
                    + "\nSee the tool/test boundary in CLAUDE.md.")
        }
        logger.lifecycle('Mod jar boundary clean: none of ' + forbidden.size()
                + ' tool-only classes are shipped.')
    }
}

/** Every {@code .class} entry a classpath contributes, named as a jar would name it. */
static Set<String> classEntries(FileCollection classpath) {
    Set<String> names = new LinkedHashSet<>()
    classpath.files.each { File element ->
        if (element.isDirectory()) {
            element.eachFileRecurse { File file ->
                if (file.name.endsWith('.class')) {
                    names.add(element.toPath().relativize(file.toPath())
                            .toString().replace('\\', '/'))
                }
            }
        } else if (element.name.endsWith('.jar') && element.isFile()) {
            new java.util.zip.ZipFile(element).withCloseable { archive ->
                archive.entries().each { entry ->
                    if (entry.name.endsWith('.class')) names.add(entry.name)
                }
            }
        }
    }
    return names
}

tasks.named('check').configure { dependsOn tasks.named('verifyModJarBoundary') }

// Wire the shaded jar into the standard build lifecycle so `gradlew build`
// produces the mod jar without needing to name `shadowJar` explicitly.
tasks.named('assemble').configure { dependsOn tasks.named('shadowJar') }

tasks.register('deployMod', Sync) {
    group = 'starsector'
    description = "Copy the mod folder into the Starsector mods directory ($starsectorModsDir)"
    // mod/sounds is generated and gitignored. Always materialize the audio
    // manifest before Sync snapshots mod/, otherwise a newly-added sound ID
    // can deploy without its matching Ogg and make Starsector fail at startup.
    dependsOn tasks.named('shadowJar'), ':asset-pipeline:processAudio'
    from modOutputDir
    into new File(starsectorModsDir, modName)
    preserve {
        // Saves and logs the user might drop in the mod folder while testing.
        include '.git/**'
    }
}

tasks.register('undeployMod', Delete) {
    group = 'starsector'
    description = "Remove the deployed mod from $starsectorModsDir"
    delete new File(starsectorModsDir, modName)
}

/**
 * The java invocation the installed `starsector.bat` would run, as an argv list.
 *
 * Running the .bat through `cmd /c` cannot report how the game died. Its trailing
 * block is malformed -- `if errorlevel 1 {` uses a brace where batch needs a paren
 * -- so cmd runs `{` as a command, reaches a bare `pause`, and returns that block's
 * status rather than the JVM's. A game that is killed mid-battle therefore leaves
 * the task green, which is exactly the signal a crash hunt needs. The .bat lives
 * under the read-only game install, so read its command line and run it directly:
 * same flags, same working directory, but the exit code and stderr are the JVM's.
 */
def starsectorLaunchArgv(File coreDir, File diagnosticsDir, boolean stockJvm) {
    def bat = new File(coreDir, 'starsector.bat')
    if (!bat.isFile()) {
        throw new GradleException("No starsector.bat in ${coreDir} -- cannot launch the game")
    }
    def line = bat.readLines().find { it.toLowerCase().contains('java.exe') }
    if (line == null) {
        throw new GradleException("No java.exe invocation in ${bat} -- cannot launch the game")
    }
    def parts = line.trim().split(/\s+/) as List<String>
    def java = new File(coreDir, parts.head())
    if (!java.isFile()) {
        throw new GradleException("${bat} names a launcher that does not exist: ${java}")
    }
    // A JVM fatal error writes hs_err_pid<pid>.log to the working directory,
    // which is the install folder -- somewhere nobody thinks to look, and which
    // a game update may wipe. Name a path under build/ instead so the crash
    // report lands with the rest of this run's evidence.
    def errorFile = new File(diagnosticsDir, 'hs_err_pid%p.log')

    // -PstockJvm drops every -XX: flag the install carries, plus -noverify, and
    // keeps heap sizing, module opens, system properties and the classpath. It
    // is a control, not a recommendation: the installed vmparams is a community
    // performance file carrying UseAVX=3, AVX3Threshold=0, -AlignVector,
    // EnableVectorAggressiveReboxing, UseVectorStubs, ShenandoahGCMode=iu and
    // -noverify, any of which can end a process in ways that skip the JVM's own
    // crash reporting entirely. Dropping the lot in one go answers "is it the
    // flags?" in a single run; bisecting them only makes sense after that
    // answers yes. Our own -XX:ErrorFile is added after the filter so a crash
    // report still lands where the rest of the evidence goes.
    def flags = parts.tail()
    if (stockJvm) {
        flags = flags.findAll { !it.startsWith('-XX:') && it != '-noverify' }
    }
    [java.canonicalPath, "-XX:ErrorFile=${errorFile.absolutePath}".toString()] + flags
}

/**
 * Forwards to the console and to a file at once.
 *
 * The JVM's own stdout/stderr is the only place a fatal-error block, a native
 * loader failure or a stack trace printed outside log4j ever appears -- none of
 * it reaches `starsector.log`. Left on the console it lives in IDE scrollback
 * and is gone by the time anyone asks what happened, which is exactly how one
 * silent death was investigated with the evidence already lost. Tee it.
 */
class TeeOutputStream extends OutputStream {
    private final OutputStream console
    private final OutputStream file

    TeeOutputStream(OutputStream console, OutputStream file) {
        this.console = console
        this.file = file
    }

    @Override void write(int b) { console.write(b); file.write(b) }

    @Override void write(byte[] buf, int off, int len) {
        console.write(buf, off, len)
        file.write(buf, off, len)
    }

    // Flush the file on every flush: a hard kill loses whatever is still
    // buffered, and the last few lines are the ones worth having.
    @Override void flush() { console.flush(); file.flush() }

    // Only the file is ours to close -- closing the console would take stdout
    // down for the rest of the build.
    @Override void close() { flush() }
}

def stockJvmRequested = providers.gradleProperty('stockJvm').map { true }.orElse(false)

tasks.register('runStarsector', Exec) {
    group = 'starsector'
    description = 'Launch Starsector after deploying the mod (-PstockJvm drops the -XX: flags from vmparams)'
    dependsOn 'deployMod'
    finalizedBy 'reportStarsectorRun'
    def coreDir = new File(starsectorDir, 'starsector-core')
    def diagnosticsDir = layout.buildDirectory.dir('starsector-run').get().asFile
    def consoleLog = new File(diagnosticsDir, 'console.log')
    def stock = stockJvmRequested
    workingDir coreDir
    // Report the JVM's own status rather than failing the build on it: a crash
    // and an ordinary quit both end this task, and only the message differs.
    ignoreExitValue = true

    def sink = null
    doFirst {
        diagnosticsDir.mkdirs()
        // One sink behind both streams, so the file interleaves them the way the
        // console does and a trace keeps the output that led up to it.
        sink = new BufferedOutputStream(new FileOutputStream(consoleLog))
        standardOutput = new TeeOutputStream(System.out, sink)
        errorOutput = new TeeOutputStream(System.err, sink)
        commandLine starsectorLaunchArgv(coreDir, diagnosticsDir, stock.get())
        if (stock.get()) {
            logger.lifecycle('runStarsector: -PstockJvm -- launching without the -XX: flags from vmparams')
        }
    }
    doLast {
        sink?.flush()
        sink?.close()
    }
}

/**
 * Writes the run's exit status down, as a finalizer rather than inside the launch.
 *
 * A finalizer runs even when the task it follows fails or is aborted, and that is
 * the whole point: a `doLast` is skipped exactly in the cases worth recording. One
 * silent death produced no summary at all and no build failure either, which left
 * the most diagnostic fact about it unrecoverable and the absence itself confusing.
 * This always writes a file, saying plainly when the status could not be obtained.
 */
tasks.register('reportStarsectorRun') {
    def diagnosticsDir = layout.buildDirectory.dir('starsector-run').get().asFile
    def consoleLog = new File(diagnosticsDir, 'console.log')
    def launch = tasks.named('runStarsector', Exec)
    doLast {
        diagnosticsDir.mkdirs()
        def result = launch.get().executionResult.getOrNull()
        def crashes = diagnosticsDir.listFiles({ f -> f.name.startsWith('hs_err_pid') } as FileFilter)
        def lines = []
        if (result == null) {
            lines << 'exit code : unavailable -- the launch task did not complete'
            lines << 'meaning   : the build was aborted before the exit status could be read'
        } else {
            int code = result.exitValue
            lines << 'exit code : ' + code + ' (' + unsignedHex(code) + ')'
            lines << 'meaning   : ' + describeExitCode(code)
        }
        lines << 'stock jvm : ' + stockJvmRequested.get()
        lines << 'finished  : ' + new Date()
        lines << 'console   : ' + consoleLog
        lines << 'crash log : ' + (crashes ? crashes*.name.join(', ') : 'none written')
        lines << ''
        def summary = new File(diagnosticsDir, 'run-summary.txt')
        summary.text = lines.join(System.lineSeparator())

        if (result == null) {
            logger.error("Starsector run status unavailable -- see ${consoleLog}.")
        } else if (result.exitValue != 0) {
            logger.error("Starsector exited with code ${result.exitValue} "
                    + "(${unsignedHex(result.exitValue)}) -- ${describeExitCode(result.exitValue)}."
                    + " See ${summary} and ${consoleLog}.")
        } else {
            logger.lifecycle("Starsector exited cleanly (code 0). Run details in ${summary}.")
        }
        if (crashes) {
            logger.error("JVM crash report(s) written: ${crashes*.name.join(', ')} in ${diagnosticsDir}")
        }
    }
}

/** The exit status as Windows wrote it. Java narrows the DWORD to a negative int. */
def unsignedHex(int code) {
    '0x' + Long.toHexString(code & 0xFFFFFFFFL).toUpperCase()
}

/**
 * What Windows means by a process exit code, for the ones worth recognising.
 *
 * A death that logs nothing is identified by its exit status or not at all, and
 * the NTSTATUS values name a cause: an illegal instruction points at the JVM's
 * experimental -XX:UseAVX / vector flags rather than at anything in the mod, and
 * an access violation points at native or driver code. Zero is the one to read
 * carefully -- it means the process was asked to stop, so if no shutdown banner
 * was logged it was killed from outside rather than having crashed.
 */
def describeExitCode(int code) {
    switch (code & 0xFFFFFFFFL) {
        case 0L:          return 'asked to stop -- with no shutdown banner logged, killed from outside the JVM'
        case 1L:          return 'generic failure'
        case 0xC0000005L: return 'ACCESS_VIOLATION -- native crash in driver or JNI code'
        case 0xC000001DL: return 'ILLEGAL_INSTRUCTION -- suspect the experimental -XX:UseAVX / vector flags in vmparams'
        case 0xC0000374L: return 'HEAP_CORRUPTION'
        case 0xC00000FDL: return 'STACK_OVERFLOW'
        case 0xC000013AL: return 'CONTROL_C_EXIT -- terminated by a console interrupt'
        case 0x40010004L: return 'DBG_TERMINATE_PROCESS -- killed by a debugger or Task Manager'
        default:          return 'unrecognised'
    }
}

def catalogSmokeMode = providers.gradleProperty('catalogSmokeMode').orElse('additive')
def catalogSmokeRoot = layout.buildDirectory.dir('catalog-smoke')

tasks.register('prepareCatalogSmoke', Sync) {
    group = 'verification'
    description = 'Stage isolated Starsector Marines catalog-provider smoke-test mods'
    dependsOn tasks.named('shadowJar'), ':asset-pipeline:processAudio'
    outputs.upToDateWhen { false }

    doFirst {
        if (!(catalogSmokeMode.get() in ['additive', 'collision'])) {
            throw new GradleException("catalogSmokeMode must be 'additive' or 'collision'")
        }
    }

    into catalogSmokeRoot.map { it.dir("${catalogSmokeMode.get()}/mods") }
    from(modOutputDir) { into modName }
    from('src/liveTest/catalog-smoke/provider-alpha') { into 'CatalogSmokeAlpha' }
    from({ file("src/liveTest/catalog-smoke/provider-beta-${catalogSmokeMode.get()}") }) {
        into 'CatalogSmokeBeta'
    }

    doLast {
        File modsDir = catalogSmokeRoot.get().dir("${catalogSmokeMode.get()}/mods").asFile
        new File(modsDir, 'enabled_mods.json').text =
                '{"enabledMods":["starsector_marines","catalog_smoke_alpha","catalog_smoke_beta"]}\n'
    }
}

tasks.register('catalogSmokeLive', Exec) {
    group = 'verification'
    description = 'Launch the installed Starsector game once against isolated two-provider catalog fixtures'
    dependsOn tasks.named('prepareCatalogSmoke')
    workingDir projectDir
    standardOutput = System.out
    errorOutput = System.err
    doFirst {
        commandLine 'pwsh', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', file('tools/catalog-smoke/run-catalog-smoke.ps1').absolutePath,
                '-ProjectDir', projectDir.absolutePath,
                '-StarsectorDir', starsectorDir.absolutePath,
                '-Mode', catalogSmokeMode.get()
    }
}

clean {
    delete modJarsDir
}
