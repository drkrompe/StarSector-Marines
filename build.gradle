plugins {
    id 'java'
    // Bundles runtime deps and rewrites their packages so they can't collide
    // with other mods' copies. fastutil in particular: the game's classloader
    // is shared, so an unrelocated copy would fight other mods that ship
    // their own version.
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.dillon.starsectormarines'
version = '0.1.0-alpha'

def starsectorDir = file(providers.gradleProperty('starsectorDir').get())
def starsectorCore = new File(starsectorDir, 'starsector-core')
def starsectorModsDir = new File(starsectorDir, 'mods')

def modName = 'StarsectorMarines'
def modId   = 'starsector_marines' // must match StarsectorMarinesModPlugin.MOD_ID
def modOutputDir = file("$projectDir/mod")
def modJarsDir = new File(modOutputDir, 'jars')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    flatDir {
        dirs starsectorCore
    }
}

configurations {
    starsector
}

dependencies {
    // Starsector runtime — provided by the game, never bundled into our jar.
    compileOnly files(
            new File(starsectorCore, 'starfarer.api.jar'),
            new File(starsectorCore, 'starfarer_obf.jar'),
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
            new File(starsectorCore, 'json.jar'),
            new File(starsectorCore, 'log4j-1.2.9.jar'),
            new File(starsectorCore, 'xstream-1.4.10.jar'),
            new File(starsectorCore, 'fs.common_obf.jar'),
    )

    // Asset-pipeline runtime classes (mesh data, model serializer, scene/skeleton/animation PODs).
    // Bundled into the mod jar via the fat-jar config below.
    implementation project(':asset-pipeline')

    // Nexerelin's signatures, compile-only: the real classes come from Nexerelin
    // itself and only when it is enabled. Also on the test classpath, which is
    // what makes verifyModJarBoundary treat them as tool-only (nex-stubs/build.gradle).
    compileOnly project(':nex-stubs')
    testImplementation project(':nex-stubs')

    // fastutil-core: primitive-keyed maps/sets for hot AI/sim paths (squad lookup,
    // crowding tables, zone ids). Shaded into our own namespace via shadowJar's
    // relocate rule below so it can't collide with another mod's copy on the
    // shared classloader.
    implementation "it.unimi.dsi:fastutil-core:${fastutilVersion}"
    // JCodec: pure-Java H.264 decoder for the arrival cinematic's video (FreeBSD/BSD-2-Clause,
    // redistributable; measured in runtime-contract.md). Shaded into our own namespace below.
    implementation 'org.jcodec:jcodec:0.2.5'

    // Lombok — same convention as the asset-pipeline module so shared style works.
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(':layer-authoring')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation files(
            new File(starsectorCore, 'starfarer.api.jar'),
            new File(starsectorCore, 'json.jar'),
            new File(starsectorCore, 'log4j-1.2.9.jar'),
            new File(starsectorCore, 'xstream-1.4.10.jar'),
    )
    // Campaign API interfaces expose LWJGL vector types in method signatures.
    // Keep them available to reflection-based API fakes without bundling them.
    testRuntimeOnly files(
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
    )
    // `shaderEvidence` makes a real GL context (HeadlessGl) and drives the mod's
    // own render classes through it, so the test sources need LWJGL 2 to COMPILE
    // against as well. compileOnly, exactly as `main` has it: the game supplies
    // the jar at runtime and it must never enter the shipped one.
    testCompileOnly files(
            new File(starsectorCore, 'lwjgl.jar'),
            new File(starsectorCore, 'lwjgl_util.jar'),
    )
}

// Every Test task here runs the same test source set, so every one of them
// loads the shipped catalogs up front and can reach the headless renderers.
// Gradle defaults a Test task to 512m, which those sit right on the edge of:
// mod/graphics is 23MB of PNG on disk but decodes to far more, since a
// 1254x1254 sheet alone is 6MB of ARGB once it is a BufferedImage, and the
// ~620 classes share one JVM (maxParallelForks = 1, no forkEvery) whose sprite
// caches live as long as it does. The symptom is not an obvious one - ImageIO
// wraps the OutOfMemoryError as an ordinary IIOException, so it surfaces as an
// unrelated sheet "failing to read", and only when a sibling session is
// competing for the machine. A cap, not a reservation, so idle runs cost
// nothing. Set once for all Test tasks rather than per task: two sessions
// diagnosing this independently both added it to `test` alone, leaving the
// value duplicated there and still missing from `commanderEvidence`, which
// renders review frames through the very renderer that was running out.
// Raised from 2g to 6g (owner, 2026-10-22): long framed evidence runs - The Burn's
// review frames at 1920x1080 - kept dying of OutOfMemoryError. The machine has 32 GB;
// this is a cap, not a reservation. -PtestHeap=<size> overrides it per run.
// What actually held the memory was measured afterwards (evidence-tasks.md, "Memory"): the headless sprite tokens kept every decoded sheet resident, 1.3 GB
// before a battle began. With that fixed The Burn's whole framed run fits in 2g.
def evidenceHeap = (findProperty('testHeap') ?: '6g').toString()
// -PtestJvmArgs="<args>" adds JVM flags to an evidence fork for one run - a flight
// recording, a heap dump on OOM - without touching the daemon, which
// JAVA_TOOL_OPTIONS would also reach.
def evidenceJvmArgs = (findProperty('testJvmArgs') ?: '').toString().trim()
tasks.withType(Test).configureEach {
    maxHeapSize = evidenceHeap
    // A repeated implicit exception loses its stack to the JIT's fast-throw
    // optimisation, and an evidence run that dies after thirteen minutes with a
    // bare `java.lang.ArrayIndexOutOfBoundsException` and no frames is a run that
    // has to be paid for again to say anything. Keep the frames.
    jvmArgs '-XX:-OmitStackTraceInFastThrow'
    if (!evidenceJvmArgs.isEmpty()) jvmArgs evidenceJvmArgs.split(/\s+/)
    // Every JVM-side measurement — the suite, commander evidence, snapshots —
    // measures shipping behaviour, never the debug scaffold. Without this,
    // IntegralSystemSystem's screen-trigger override would raise a screen in
    // every scene, the policy tests would be asserting nothing, and evidence
    // runs would report a battle nobody can play.
    systemProperty 'marines.debug.screenTrigger', 'off'
    // Keep evidence and ordinary tests deterministic even though live battles
    // use async rally routes and influence propagation. Profile A/B can opt in.
    systemProperty 'battle.pathfinding.asyncDefendTrack',
            System.getProperty('battle.pathfinding.asyncDefendTrack', 'false')
    systemProperty 'battle.pathfinding.asyncClearance',
            System.getProperty('battle.pathfinding.asyncClearance', 'false')
    systemProperty 'battle.influence.async',
            System.getProperty('battle.influence.async', 'false')
    forwardBattleSwitches(delegate)
}

// A `-Dbattle.*` switch on the command line reaches the Gradle daemon and stops
// there; the fork that runs the measurement never sees it. Forwarding them is
// what makes a control run — the same evidence with one routing or pathfinding
// layer switched off — a single command rather than a checkout of an older
// commit, which would measure every other difference between the two trees at
// the same time.
void forwardBattleSwitches(task) {
    System.properties.each { key, value ->
        if (key.toString().startsWith('battle.')) {
            task.systemProperty key.toString(), value
        }
    }
}

test {
    useJUnitPlatform {
        excludeTags 'battle-profile', 'battle-tail-profile', 'convoy-route-evidence',
                'swarm-flow-evidence',
                'commander-balance', 'conquest-trial-evidence',
                'sabotage-command-evidence', 'assault-command-evidence', 'relief-command-evidence', 'counterattack-command-evidence', 'junction-command-evidence', 'relay-nine-command-evidence', 'thunder-run-command-evidence', 'last-lift-command-evidence', 'supply-route-campaign-evidence',
                'raid-command-evidence', 'extraction-command-evidence', 'colony-breach-command-evidence', 'cordon-command-evidence', 'heart-command-evidence', 'corvus-command-evidence', 'power-suit-campaign-evidence',
                'story-command-evidence',
                'crew-liveliness', 'shader-evidence', 'render-evidence', 'garrison-evidence',
                'generated-space-evidence',
                'loadout-card-sheet', 'loadout-matchup', 'armor-matchup', 'armor-economy-evidence',
                'bloom-evidence', 'story-map-pool-evidence'
    }
    testLogging {
        // Audit-style tests print their report to stdout — stream it to the
        // gradle console so devs don't have to dig through the XML report.
        showStandardStreams = true
    }
    // Tests that read vanilla files or sprites from the game install find it
    // through the project-level `starsectorDir` gradle property. Same source of truth the build.gradle root
    // uses for compileOnly + deployMod (resolved at line 13).
    systemProperty 'starsectorDir', starsectorDir.absolutePath
    // ProjectTilesetSeedsTest reads the checked-in tileset seeds at runtime, so
    // Gradle cannot see them as inputs and happily reports UP-TO-DATE after a
    // seed is added or edited - which silently disarms the check that every raw
    // sheet arrives annotated. Declare them.
    inputs.dir('art-source/tilesets')
    inputs.dir('art-source/roads')
    inputs.dir('art-source/story-scenes')
            .withPropertyName('tilesetSeeds')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // The shipped catalogs and art are read off disk at runtime too, and by far
    // more tests: TileRegistryTestInstaller loads every builtin catalog before
    // any test runs, and the preview/tools tests read the real sheets. Edit a
    // `.tileset.json` or a sheet without these and gradle reports UP-TO-DATE
    // with the change unverified. Declare `mod/data` and `mod/graphics` only -
    // `mod/jars` and `mod/sounds` are outputs of shadowJar and deployMod, so
    // including them would make `:test` stale on every single build.
    inputs.dir('mod/data')
    // Opening localization checks catalog references in production code.
    inputs.dir('src/main/java')
    // SwitchRegistryTest holds every -Dbattle.*/-Dmarines.* read against it.
    inputs.file('roadmap/switches.md')
    inputs.file('asset-pipeline/src/tool/resources/audio/audio.json')
    inputs.dir('asset-pipeline/src/tool/resources/audio/wayline')
    inputs.dir('art-source/audio/shepherd')
    inputs.dir('asset-pipeline/src/tool/resources/audio/operation-radio/live')
    inputs.dir('asset-pipeline/src/tool/resources/audio/company-officer')
            .withPropertyName('shippedCatalogs')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('mod/graphics')
            .withPropertyName('shippedArt')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // DerivedReliefFollowsItsAtlasTest reads the derivation manifest to learn
    // which sheets have relief baked for them. It is the bake's inclusion list,
    // so adding a sheet to it widens the check - and without this, gradle
    // reports UP-TO-DATE and the new sheet is never looked at.
    inputs.file('asset-pipeline/src/tool/resources/tilemaps/tilemaps.json')
            .withPropertyName('tileMapManifest')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // Same hazard, different root: CatalogSmokeFixtureTest reads the staged
    // two-provider fixture straight out of the source tree rather than off the
    // test classpath, so gradle cannot see it either.
    inputs.dir('src/liveTest/catalog-smoke')
            .withPropertyName('catalogSmokeFixture')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // Opt-in gate for the ecs-migration Phase-0 access micro-bench
    // (EcsAccessBenchTest). Off by default so the normal suite stays fast for
    // concurrent sessions; run on demand with `-Decs.bench=true`.
    systemProperty 'ecs.bench', System.getProperty('ecs.bench', 'false')
}

